[package]
name = "scene_builder_app"
version = "3.0.0"
description = "egui desktop UI for SexLab Scene Builder"
authors = ["Scrab", "I unpause", "Miss Corruption"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.95.0"
build = "build.rs"

[[bin]]
name = "scene_builder_app"
path = "src/main.rs"

[dependencies]
scene_builder_core = { path = "../scene_builder_core" }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
rfd = "0.15"
open = "5"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
fern = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"
