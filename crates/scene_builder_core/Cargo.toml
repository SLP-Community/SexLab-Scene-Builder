[package]
name = "scene_builder_core"
version = "3.0.0"
description = "Domain library for SexLab Scene Builder packs"
authors = ["Scrab", "I unpause", "Miss Corruption"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.95.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.8.7"
postcard = "1.0.4"
rand = "0.8.5"
nanoid = "0.4.0"
bitflags = "2.13"
log = "0.4.19"
tokio = { version = "1", features = ["rt", "macros"] }
serde_hkx_features = { git = "https://github.com/SARDONYX-sard/serde-hkx", tag = "1.0.1" }
indexmap = { version = "2", features = ["serde"] }
