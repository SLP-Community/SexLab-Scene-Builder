name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: scene_builder_app-linux-x86_64
            cli_artifact: scene_builder_cli-linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: scene_builder_app-windows-x86_64.exe
            cli_artifact: scene_builder_cli-windows-x86_64.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux GUI dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev pkg-config

      - name: Build release binaries
        run: |
          cargo build --release -p scene_builder_app -p scene_builder_cli --target ${{ matrix.target }}

      - name: Package Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cp "target/${{ matrix.target }}/release/scene_builder_app" "${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/scene_builder_cli" "${{ matrix.cli_artifact }}"
          chmod +x "${{ matrix.artifact }}" "${{ matrix.cli_artifact }}"

      - name: Package Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/scene_builder_app.exe" "${{ matrix.artifact }}"
          Copy-Item "target/${{ matrix.target }}/release/scene_builder_cli.exe" "${{ matrix.cli_artifact }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.cli_artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
