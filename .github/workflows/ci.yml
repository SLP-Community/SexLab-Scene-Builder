name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  rust-check:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux GUI dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev pkg-config

      - name: Check core
        run: cargo check -p scene_builder_core --target ${{ matrix.target }}

      - name: Check CLI
        run: cargo check -p scene_builder_cli --target ${{ matrix.target }}

      - name: Check egui app
        run: cargo check -p scene_builder_app --target ${{ matrix.target }}

      - name: Test core
        run: cargo test -p scene_builder_core --target ${{ matrix.target }}
